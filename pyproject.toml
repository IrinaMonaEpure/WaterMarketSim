[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "WaterMarketSim"
version = "0.1.0"
description = "Agent-based modelling of drought adaptation and subsequent flood vulnerability in Nepal"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
WaterMarketSim = "WaterMarketSim.main:main"

[tool.setuptools.packages.find]
where = ["src"]